name: Deploy website

on:
  # Автозапуск отключён: сайт публикуется только вручную —
  # Actions → Deploy website → Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Пустая строка, если секрет PAGES_PAT не задан.
      PAGES_PAT: ${{ secrets.PAGES_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release feed and config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YL_SITE_URL: ${{ vars.YL_SITE_URL }}
        run: node scripts/build-site.mjs

      - name: Check that Pages is enabled
        # Если есть PAGES_PAT, сайт Pages создастся на следующем шаге сам.
        if: env.PAGES_PAT == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" > /dev/null 2>&1; then
            echo "::error title=GitHub Pages не включены::Откройте Settings → Pages → Build and deployment → Source: GitHub Actions и запустите workflow снова."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # GITHUB_TOKEN не может создать сайт Pages: GitHub разрешает
          # автоматическое включение только для PAT или GitHub App.
          # Поэтому Pages нужно один раз включить вручную:
          # Settings → Pages → Build and deployment → Source: GitHub Actions.
          # Если добавить секрет PAGES_PAT (classic PAT со scope `repo`),
          # workflow включит Pages сам.
          token: ${{ secrets.PAGES_PAT || github.token }}
          enablement: ${{ secrets.PAGES_PAT != '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
